<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-header">
        <div class="logo-mark" style="margin: 0 auto;">🏫</div>
        <h1>Create Account</h1>
        <p>Register as student or faculty</p>
      </div>

      <form id="register-form" action="{{ url_for('register') }}" method="post">
        <div class="form-grid">
          <div class="field">
            <label for="full_name">Full Name</label>
            <input id="full_name" name="full_name" type="text" required placeholder="Your full name" />
          </div>

          <div class="field">
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
            </select>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required placeholder="Choose username" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="Enter email" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Create password" />
          </div>

          <div class="form-row">
            <div class="field">
              <label for="department">Department</label>
              <input id="department" name="department" type="text" placeholder="e.g. Computer Science" />
            </div>
            <div class="field">
              <label for="year_of_study">Year</label>
              <select id="year_of_study" name="year_of_study">
                <option value="">Select</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit" style="width:100%;">Register</button>
          </div>
        </div>
      </form>

      <div id="form-message" class="alert"></div>

      <div class="linkline">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
