{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div class="dashboard-page">
  <div class="container">
    <div class="detail-card" style="max-width: 640px; margin: 60px auto; text-align: center;">
      <div class="logo-mark" style="margin: 0 auto 14px;">⚠️</div>
      <h1>Something went wrong</h1>
      <p class="muted">{{ error }}</p>
      <div class="action-row" style="justify-content: center; margin-top: 24px;">
        <a class="btn btn-primary" href="{{ url_for('home') }}">Go Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
