<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-header">
        <div class="logo-mark" style="margin: 0 auto;">🏫</div>
        <h1>{{ 'Admin Login' if role == 'admin' else 'Faculty Login' if role == 'faculty' else 'Student Login' }}</h1>
        <p>Access the academic management portal</p>
      </div>

      <form id="login-form" action="{{ url_for('login') }}" method="post">
        <div class="form-grid">
          <div class="field">
            <label for="role">Login as</label>
            <select id="role" name="role">
              <option value="student" {% if role == 'student' %}selected{% endif %}>Student</option>
              <option value="faculty" {% if role == 'faculty' %}selected{% endif %}>Faculty</option>
              <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required placeholder="Enter username" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Enter password" />
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" type="submit" style="width:100%;">Login</button>
          </div>
        </div>
      </form>

      <div id="form-message" class="alert"></div>

      <div class="linkline">
        Need an account? <a href="{{ url_for('register') }}">Sign up here</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
